app-id: io.github.Dretch.MonomerFlatpakExample
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: monomer-flatpak-example
finish-args:
- --socket=fallback-x11
- --socket=wayland
- --share=ipc
- --device=dri
cleanup:
- /lib/x86_64-linux-ghc-9.6.6
- /share/doc/x86_64-linux-ghc-9.6.6
- /lib/ghc-*
- /bin/alex
- /bin/c2hs
- /bin/dev-test-app
- /bin/happy
- /share/*-ghc-*/alex-*
- /share/*-ghc-*/c2hs-*
- /share/*-ghc-*/happy-*
- /share/*-ghc-*/sdl2-*
cleanup-commands:
- find /app/cabal/ghc-* -mindepth 1 \( \( -not -path '*/monomer-flatpak-example*'
  -a -path '*/bin/*' \) -o -path '*/lib/*' \) -delete
- mkdir -p /app/share/{applications,icons/hicolor/512x512/apps,metainfo}
- cp /app/cabal/ghc-*/monomer-flatpak-example-*/share/*.desktop /app/share/applications
- cp /app/cabal/ghc-*/monomer-flatpak-example-*/share/*.png /app/share/icons/hicolor/512x512/apps
- cp /app/cabal/ghc-*/monomer-flatpak-example-*/share/*.metainfo.xml /app/share/metainfo
modules:
- name: ghc-9.6.6-x86_64
  only-arches:
  - x86_64
  cleanup:
  - /bin/ghc
  - /bin/ghc-9.6.6
  - /bin/ghc-pkg
  - /bin/ghc-pkg-9.6.6
  - /bin/ghci
  - /bin/ghci-9.6.6
  - /bin/haddock
  - /bin/haddock-ghc-9.6.6
  - /bin/runghc
  - /bin/runghc-9.6.6
  - /bin/runhaskell
  - /bin/hp2ps
  - /bin/hpc
  - /bin/hsc2hs
  - /lib/libtinfo.so.5
  - /lib/ghc-9.6.6
  - /share/man
  - /share/doc/ghc-9.6.6
  buildsystem: simple
  builddir: false
  build-commands:
  - mkdir -p /app/lib
  - ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so /app/lib/libtinfo.so.5
  - ./configure --prefix=/app
  - make install
  sources:
  - sha256: ff5b4929a4e89c536e7badb3b142e353dc4bda1f31d3ee446406ad88c3bebddf
    type: archive
    url: https://downloads.haskell.org/ghc/9.6.6/ghc-9.6.6-x86_64-deb9-linux.tar.xz
- name: cabal-install-3.10.3.0-x86_64
  only-arches:
  - x86_64
  cleanup:
  - /bin/cabal
  buildsystem: simple
  builddir: false
  build-commands:
  - install cabal /app/bin
  sources:
  - sha256: 97e61bcd143f0b8a181ea2261a1de587b58fa9f84d123b9b9cec4463ae2f41c6
    strip-components: 0
    type: archive
    url: https://downloads.haskell.org/cabal/cabal-install-3.10.3.0/cabal-install-3.10.3.0-x86_64-linux-deb9.tar.xz
- shared-modules/glu/glu-9.json
- shared-modules/glew/glew.json
- name: haskell-parts
  buildsystem: simple
  builddir: false
  build-commands:
  - mkdir .cabal
  - touch .cabal/config
  - 'echo ''packages: */'' > cabal.project'
  - cabal --config-file=.cabal/config -j2 --offline --store-dir
    /app/cabal --installdir=/app/bin v2-install exe:monomer-flatpak-example
